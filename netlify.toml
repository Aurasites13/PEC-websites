[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify auto-detects the form in contact.html (data-netlify="true") at
# deploy time — no extra configuration needed for form submissions to work.
